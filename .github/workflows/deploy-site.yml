name: Deploy site (GitHub Pages)

# 构建 oauth-proxy/site 下的 Hexo 静态站（落地页 + Wiki）并发布到 GitHub Pages。
# 站点使用当前仓库默认 Pages 项目地址,不绑定上游自定义域名。
# 注意：需在仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。

on:
  push:
    branches: [main]
    paths:
      - 'oauth-proxy/site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署；新提交取消进行中的旧部署。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oauth-proxy/site
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oauth-proxy/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (hexo generate)
        run: npx hexo generate

      - name: Check project paths
        run: python3 ../../scripts/check-site-paths.py public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: oauth-proxy/site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
