name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号(如 1.0.0，需对应已存在的 *-pre 预发布)；留空=自动取最新 pre'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Promote Pre-release to Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Resolve version (input or latest pre-release)
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VER="$INPUT_VERSION"
          if [ -z "$VER" ]; then
            echo "未指定版本，自动选取版本号最大的预发布(*-pre)…"
            # ★ 不能用 `.[0].tagName` —— GitHub 返回的顺序**不可依赖**,没写进文档也不自洽。
            #   2026-07-19 实测反证:v1.0.0-build557-pre 排第 1,而 v0.1.0-build566-pre
            #   的 id / created_at / published_at 三个键都更大更晚,却排在后面。
            #   照抄顺序 = 把更旧的包提升成正式版,**降级伪装成升级**,而且一发就是全量用户。
            #   crates/core/src/update.rs 里的 pick_newest_release 早就因为同一个坑改成
            #   「按版本号取最大」了,这里是同一条链路上漏掉的另一半。
            #   排序键:major/minor/patch/build 各补零到 10 位后字典序倒排。
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 100 \
              --json tagName,isPrerelease \
              --jq 'map(select(.isPrerelease))|.[].tagName' \
              | awk '{
                  if ($0 !~ /^v[0-9]+\.[0-9]+\.[0-9]+(-build[0-9]+)?-pre$/) next;
                  t=$0; v=t; sub(/^v/,"",v); sub(/-pre$/,"",v);
                  b=0;
                  if (match(v,/-build[0-9]+$/)) { b=substr(v,RSTART+6); sub(/-build[0-9]+$/,"",v) }
                  split(v,a,".");
                  printf "%010d%010d%010d%010d %s\n", a[1], a[2], a[3], b, t
                }' \
              | sort -r | head -1 | cut -d" " -f2)
            if [ -z "$TAG" ]; then
              echo "未找到任何预发布版本，无法发布"; exit 1
            fi
            VER=$(echo "$TAG" | sed -E 's/^v//; s/-pre$//')
            echo "选取到最新预发布: $TAG -> 版本 $VER"
          fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-build[0-9]+)?$ ]] || { echo "版本格式不合法"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "pretag=v$VER-pre" >> "$GITHUB_OUTPUT"

      - name: Download Pre-release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/assets
          gh release download "${{ steps.resolve.outputs.pretag }}" \
            --dir /tmp/assets \
            --repo "${{ github.repository }}"
          echo "Downloaded assets:"
          ls -lah /tmp/assets/

      - name: Require complete assets and successful platform checks
        id: policy
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_TAG: ${{ steps.resolve.outputs.pretag }}
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          RELEASE_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')
          python3 scripts/check-release-policy.py /tmp/assets "$RELEASE_VERSION" "$RELEASE_COMMIT"
          (cd core && go run ./cmd/signupdate -verify "$RELEASE_TAG" /tmp/assets/SHA256SUMS.txt)
          STABLE_TAG="v$RELEASE_VERSION"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$STABLE_TAG")" ]; then
            git fetch --depth=1 origin "refs/tags/$STABLE_TAG"
            STABLE_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')
            [ "$STABLE_COMMIT" = "$RELEASE_COMMIT" ] || { echo "已有稳定标签与预发布提交不一致"; exit 1; }
          fi
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Carry over the pre-release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ steps.resolve.outputs.version }}"
          # 预发布的说明就是**这一版真实的提交清单**(build.yml 生成的),
          # 提升成正式版时原样带过来。在这儿重新算一遍反而会算错:
          # 这个 job 根本没 checkout 仓库,拿不到历史。
          gh release view "${{ steps.resolve.outputs.pretag }}"             --repo "${{ github.repository }}" --json body --jq .body > /tmp/notes.md || true
          if [ ! -s /tmp/notes.md ]; then
            echo "## 本次更新" > /tmp/notes.md
            echo "" >> /tmp/notes.md
            echo "- 预发布里没有更新说明,这一版的改动请看提交历史。" >> /tmp/notes.md
          fi
          # 下载与说明放在**更新说明后面**。放前面的话应用内弹窗第一屏全是
          # 每次都一样的下载指引,用户看不到这次到底改了什么。
          cat >> /tmp/notes.md <<EOF

          ### 下载
          - **Windows**:\`LinPlayer-Windows-v$VER.zip\`(免安装绿色包,解压即用)
          - **Linux**:\`LinPlayer-Linux-v$VER.zip\`(x86_64 绿色包,解压后运行 \`./LinPlayer\`;需要系统装有 libmpv)
          - **安卓手机**:\`app-arm64-v8a-release.apk\`
          - **安卓 TV**:\`app-tv-armeabi-v7a-release.apk\`(32 位,电视盒子;装之前在电视上确认支持 armeabi-v7a)

          ### 说明
          - 应用内「设置 → 更新 → 检查更新」可以一路走完下载和安装,不用手动下包。
          - Windows 端内置完整版 libmpv(支持 PGS/SUP 图形字幕)。
          - Linux 端不带 libmpv,用系统的:Debian/Ubuntu 装 \`libmpv2\`(22.04 是 \`libmpv1\`),Fedora 装 \`mpv-libs\`,Arch 装 \`mpv\`。
            也能在终端里调:\`./LinPlayer call <命令> '<JSON>'\`,\`./LinPlayer commands\` 列出全部命令。
          - Linux 上打开就崩(SIGSEGV)的话,先试 \`LP_RENDER=software ./LinPlayer\` ——
            那是绕开显卡驱动的 GL 上下文、整张界面交给 CPU 画。能起来就说明崩在驱动那一侧,
            请把 \`coredumpctl info LinPlayer\` 的输出贴进 issue。
          - 绿色包的全部数据(账号/缓存/下载)都写在主程序同级的 \`userdata/\`,
            整个文件夹拷走即完成迁移;删掉文件夹即卸载干净。
          EOF
          sed -i 's/^          //' /tmp/notes.md
          echo "---- 最终发布说明 ----"; cat /tmp/notes.md

      - name: Generate SHA256 checksums
        run: |
          # 重新为最终发布产物生成汇总校验文件（覆盖预发布里旧的同名文件），
          # 随 files: /tmp/assets/* 一起上传，供 App 端校验安装包完整性。
          cd /tmp/assets
          rm -f SHA256SUMS
          sha256sum *.zip *.apk RELEASE-STATUS.json > SHA256SUMS
          echo "Generated SHA256SUMS:"; cat SHA256SUMS

      - name: Sign stable update manifest
        env:
          LP_UPDATE_SIGNING_SEED: ${{ secrets.LP_UPDATE_SIGNING_SEED }}
          RELEASE_TAG: v${{ steps.resolve.outputs.version }}
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          cd core
          go run ./cmd/signupdate "$RELEASE_TAG" /tmp/assets/SHA256SUMS
          go run ./cmd/signupdate -verify "$RELEASE_TAG" /tmp/assets/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.resolve.outputs.version }}
          target_commitish: ${{ steps.policy.outputs.commit }}
          name: Release v${{ steps.resolve.outputs.version }}
          prerelease: false
          make_latest: true
          files: /tmp/assets/*
          body_path: /tmp/notes.md

      - name: Delete Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.resolve.outputs.pretag }}" \
            --yes \
            --repo "${{ github.repository }}" \
            --cleanup-tag
